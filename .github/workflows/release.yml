name: Build & Release Python Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ENTRY_SCRIPT: haunted_files.py
  BIN_NAME: haunted-files        
  APP_NAME: HauntedFiles        

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt } else { pip install PyQt6 }
          pip install pyinstaller
      - name: Build Windows EXE
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          pyinstaller --onefile --windowed --name "${{ env.BIN_NAME }}-$tag-windows-x86_64" "${{ env.ENTRY_SCRIPT }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.BIN_NAME }}-*-windows-x86_64.exe

  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI & AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 python3-tk fuse libfuse2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install PyQt6; fi
          pip install pyinstaller
      - name: Build Linux Executable
        run: pyinstaller --onefile --windowed --name "${BIN_NAME}" "${ENTRY_SCRIPT}"
      - name: Package AppImage
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p AppDir/usr/bin
          cp "dist/${BIN_NAME}" "AppDir/usr/bin/${BIN_NAME}"

          if [ -f assets/icon.png ]; then
            cp assets/icon.png "AppDir/${BIN_NAME}.png"
          else
            python3 -c "import zlib, struct; w=h=64; raw=b''.join(b'\x00'+b'\x7c\x3a\xed\xff'*w for _ in range(h)); chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open('AppDir/${BIN_NAME}.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
          fi
          ln -s "${BIN_NAME}.png" AppDir/.DirIcon

          cat << EOF > "AppDir/${BIN_NAME}.desktop"
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Exec=${BIN_NAME}
          Icon=${BIN_NAME}
          Categories=Utility;
          Terminal=false
          EOF

          cat << EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/${BIN_NAME}" "\$@"
          EOF
          chmod +x AppDir/AppRun

          curl -fL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage

          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "${APP_NAME}-${TAG}-x86_64.AppImage"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-*-x86_64.AppImage
